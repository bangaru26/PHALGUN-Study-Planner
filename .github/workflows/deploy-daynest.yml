name: Deploy DayNest PWA
on:
  push:
    branches: [main]
    paths:
      - 'mobile-organizer/**'
      - '.github/workflows/deploy-daynest.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload DayNest
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-organizer
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
