name: PHALGUN Pull Request Browser Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/test_live_app.mjs"
      - "*.html"
      - "*.js"
      - "*.css"
      - "sw.js"
      - ".github/workflows/pr-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phalgun-pr-browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save playwright

      - name: Exercise current live Study Desk with proposed browser checks
        env:
          PHALGUN_BASE_URL: https://bangaru26.github.io/PHALGUN-Study-Planner
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        timeout-minutes: 15
        run: timeout --signal=TERM --kill-after=30s 14m node scripts/test_live_app.mjs
