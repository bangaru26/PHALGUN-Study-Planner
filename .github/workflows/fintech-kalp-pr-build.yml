name: Fintech Kalp Flutter PR Build

on:
  pull_request:
    branches: [main]
    paths:
      - "fintech-kalp_flutter/**"
      - ".github/workflows/fintech-kalp-pr-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fintech-kalp-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: fintech-kalp_flutter
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: fintech-kalp_flutter
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build release web app
        working-directory: fintech-kalp_flutter
        run: flutter build web --release --base-href /PHALGUN-Study-Planner/fintech-kalp/
