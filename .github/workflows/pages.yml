name: Deploy PHALGUN Study Planner to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.webmanifest"
      - "*.json"
      - "assets/**"
      - "data/**"
      - "scripts/test_live_app.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app assets
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f icon.svg
          test -f sw.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const scripts=[...h.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(!scripts.length) throw Error('No inline app script found'); scripts.forEach(s=>new Function(s)); JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); console.log('App JavaScript and manifest syntax passed')"
          python -m py_compile scripts/monitor_sources.py
          python -m json.tool monitoring/source-catalog.json > /dev/null
          test -f monitoring.html
          grep -q "Subject Change Watch" monitoring.html
          echo "Monitor Python syntax, source registry JSON, and dashboard presence passed"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exercise deployed app in a real browser
        env:
          PHALGUN_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test_live_app.mjs

      - name: Verify live app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BASE_URL}index.html?verify=${GITHUB_SHA}" -o /tmp/index.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BASE_URL}manifest.webmanifest?verify=${GITHUB_SHA}" -o /tmp/manifest.json
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BASE_URL}sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BASE_URL}monitoring.html?verify=${GITHUB_SHA}" -o /tmp/monitoring.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BASE_URL}monitoring/source-catalog.json?verify=${GITHUB_SHA}" -o /tmp/source-catalog.json
          python -m json.tool /tmp/source-catalog.json > /dev/null
          grep -q "Subject Change Watch" /tmp/monitoring.html
          grep -q 'Study Desk' /tmp/index.html
          grep -q 'Study · Progress · Assess (SPA)' /tmp/index.html
          grep -q "strip.id='lessonStrip'" /tmp/index.html
          grep -q 'id="assessmentSection"' /tmp/index.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BASE_URL}study-desk-icon.svg?verify=${GITHUB_SHA}" -o /tmp/study-desk-icon.svg
          grep -q '<svg' /tmp/study-desk-icon.svg
          node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.json','utf8')); console.log('Live Study Desk, pinned navigation, icon, manifest and service worker verified')"
